<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="쇼핑 리스트">
<meta name="theme-color" content="#0E0F12">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>쇼핑 리스트</title>
<link rel="preload" href="fonts/list-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* List Sans = Pretendard(SIL OFL)를 자주 쓰는 글자만 남겨 이름을 바꾼 글꼴. 없는 글자는 시스템 글꼴로 보인다. */
@font-face{font-family:"List Sans";src:url("fonts/list-sans.woff2") format("woff2-variations"),url("fonts/list-sans.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
/* Layout: 어두운 한 화면 — 위에 개수 타일과 가게 칩, 가운데 날짜별 묶음(지난 것 → 오늘 → 언제든 → 다가올 날),
   아래 엄지가 닿는 곳에 입력칸. 고치기는 아래에서 올라오는 시트, 구매 기록은 오른쪽에서 들어오는 화면. */
:root{
  --bg:#0E0F12;
  --card:#17191E;
  --field:#202329;
  --sheet:#14161A;
  --sep:#25282E;
  --ink:#F2F3F5;
  --ink-2:#C9CCD3;
  --soft:#959AA5;
  --faint:#5C616B;
  --lime:#C8F25A;
  --lime-ink:#12160A;
  --lime-soft:#222A12;
  --red:#FF7B7B;
  --red-soft:#2C1618;
  --red-fill:#E5484D;
  --bar:rgba(14,15,18,.84);
  --sans:"List Sans",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --kb:0px;
  --composer-h:76px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.4;cursor:default}
svg{display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.col{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px)}
.top-in{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;align-items:center;gap:12px}
.heading{flex:1;min-width:0}
h1{margin:0;font-size:1.875rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tally{margin:3px 0 0;color:var(--soft);font-size:.8125rem;font-variant-numeric:tabular-nums}
.pill-btn{flex:none;height:36px;padding:0 14px 0 11px;border:0;border-radius:18px;background:var(--field);display:inline-flex;align-items:center;gap:6px;font-size:.875rem;font-weight:650}
.pill-btn svg{width:18px;height:18px;color:var(--lime)}

main.col{padding-top:4px;padding-bottom:calc(var(--composer-h) + 28px)}
.notice{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--red-soft);color:var(--red);font-size:.875rem}

/* count tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tile{border:0;border-radius:14px;background:var(--card);padding:9px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:1px}
.tile .tl{font-size:.75rem;color:var(--soft);font-weight:650;white-space:nowrap}
.tile .tn{font-size:1.375rem;font-weight:780;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.tile.is-zero .tn{color:var(--faint)}
.tile.is-over{background:var(--red-soft)}
.tile.is-over .tl,.tile.is-over .tn{color:var(--red)}
.tile.is-today .tn{color:var(--lime)}

/* store filter chips */
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
.hscroll::-webkit-scrollbar{display:none}
.stores{margin-bottom:16px}
.c{flex:none;position:relative;height:32px;padding:0 12px;border:0;border-radius:16px;background:var(--field);color:var(--ink-2);font-size:.8125rem;font-weight:650;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.c svg{width:15px;height:15px;flex:none}
.c .n{color:var(--faint);font-variant-numeric:tabular-nums}
.c .dim{color:var(--soft);font-weight:500}
.c[aria-pressed="true"],.c.on{background:var(--lime);color:var(--lime-ink)}
.c[aria-pressed="true"] .n,.c.on .dim{color:rgba(18,22,10,.62)}
.c input[type="date"]{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;-webkit-appearance:none;appearance:none}
.stores .c{background:var(--card)}
.stores .c[aria-pressed="true"]{background:var(--lime)}

/* sections and rows */
#lists{display:grid;gap:18px}
.sec{scroll-margin-top:calc(86px + env(safe-area-inset-top,0px))}
.row{scroll-margin-top:calc(96px + env(safe-area-inset-top,0px));scroll-margin-bottom:calc(var(--composer-h) + 12px)}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 7px;font-size:.9375rem;font-weight:750}
.sec-h .sub{color:var(--soft);font-weight:500;font-size:.8125rem}
.sec-h .n{margin-left:auto;color:var(--faint);font-size:.8125rem;font-weight:600;font-variant-numeric:tabular-nums}
.sec-over .sec-h{color:var(--red)}
.sec-today .sec-h{color:var(--lime)}
.card{list-style:none;margin:0;padding:0;border-radius:16px;background:var(--card);overflow:hidden}
.row{position:relative;overflow:hidden}
.row-fg{position:relative;display:flex;align-items:center;min-height:56px;background:var(--card);touch-action:pan-y}
.row + .row .row-fg::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--sep)}
.tick{flex:none;width:52px;align-self:stretch;padding:0;border:0;background:none;display:grid;place-items:center}
.tick i{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;transition:background-color .15s,border-color .15s}
.tick svg{width:15px;height:15px;color:var(--lime-ink);opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s}
.row.is-bought .tick i{background:var(--lime);border-color:var(--lime)}
.row.is-bought .tick svg{opacity:1;transform:none}
.row.is-bought .name{color:var(--soft);text-decoration:line-through}
.rbody{flex:1;min-width:0;align-self:stretch;padding:10px 12px 10px 0;border:0;background:none;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.nline{display:flex;align-items:baseline;gap:7px;min-width:0}
.name{min-width:0;font-weight:560;overflow-wrap:anywhere}
.name.is-blank{color:var(--soft)}
.qty{flex:none;color:var(--lime);font-size:.8125rem;font-weight:750;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;column-gap:6px;color:var(--soft);font-size:.8125rem}
.meta span + span::before{content:"·";margin-right:6px;color:var(--faint)}
.meta .warn{color:var(--red)}
.go{flex:none;width:38px;height:38px;margin-right:10px;border-radius:11px;background:var(--lime-soft);color:var(--lime);display:grid;place-items:center}
.go svg{width:17px;height:17px}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;font-size:.875rem;font-weight:750}
.swipe-bg span{display:none;align-items:center;gap:6px}
.swipe-bg svg{width:18px;height:18px}
.row[data-dir="buy"] .swipe-bg{background:var(--lime-soft);color:var(--lime);justify-content:flex-start}
.row[data-dir="del"] .swipe-bg{background:var(--red-soft);color:var(--red);justify-content:flex-end}
.row[data-dir="buy"] .sb-buy,.row[data-dir="del"] .sb-del{display:inline-flex}
.row[data-dir="buy"].is-armed .swipe-bg{background:var(--lime);color:var(--lime-ink)}
.row[data-dir="del"].is-armed .swipe-bg{background:var(--red-fill);color:#FFFFFF}
.row.is-new .row-fg{animation:flash 1.4s ease-out}
@keyframes flash{from{background:#2E3A12}to{background:var(--card)}}

/* empty */
.empty{padding:34px 4px 8px;text-align:center}
.empty .badge{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--lime-soft);color:var(--lime);display:grid;place-items:center}
.empty .badge svg{width:30px;height:30px}
.empty h2{margin:0 0 6px;font-size:1.25rem;font-weight:780;letter-spacing:-.01em}
.empty p{margin:0 auto;max-width:22em;color:var(--soft);font-size:.9375rem}
.tips{list-style:none;margin:20px auto 0;padding:0;max-width:21em;display:grid;gap:8px;text-align:left}
.tips li{display:flex;gap:10px;padding:11px 13px;border-radius:13px;background:var(--card);color:var(--ink-2);font-size:.875rem}
.tips svg{flex:none;width:17px;height:17px;margin-top:1px;color:var(--lime)}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:var(--kb);z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--sep)}
.composer .col{padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.kb-open .composer .col{padding-bottom:8px}
.composer .hscroll{margin-bottom:8px}
.sug .c svg{color:var(--soft)}
.add-row{display:flex;gap:8px;align-items:center}
.add-row input{flex:1;min-width:0;height:46px;padding:0 16px;border:0;border-radius:23px;background:var(--field);font-size:1rem}
.add-row input::placeholder{color:var(--faint)}
.add-row input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--lime)}
.add{flex:none;width:46px;height:46px;border:0;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.add svg{width:22px;height:22px}

/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb);max-height:calc(100% - var(--kb) - 28px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:22px 22px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;margin:0 auto 6px;border-radius:3px;background:var(--faint)}
.sheet-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-name{flex:1;min-width:0;height:48px;padding:0;border:0;background:none;font-size:1.375rem;font-weight:780;letter-spacing:-.02em}
.sheet-name:focus{outline:none}
.sheet-name::placeholder{color:var(--faint)}
.x{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:var(--field);color:var(--soft);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.group{margin-bottom:10px;border-radius:16px;background:var(--card)}
.f{display:flex;align-items:center;gap:12px;min-height:54px;padding:7px 12px 7px 14px}
.f + .f{border-top:1px solid var(--sep)}
.fl{flex:none;width:50px;color:var(--soft);font-size:.875rem;font-weight:650}
.f input{flex:1;min-width:0;height:40px;padding:0;border:0;background:none;font-size:1rem}
.f input:focus{outline:none}
.f input::placeholder{color:var(--faint)}
.f input[type="date"]{color-scheme:dark}
.f .chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.f .go{margin-right:0}
.won{color:var(--soft)}
.stepper{margin-left:auto;display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border:0;border-radius:12px;background:var(--field);display:grid;place-items:center}
.stepper svg{width:18px;height:18px}
.stepper output{min-width:52px;text-align:center;font-size:1.0625rem;font-weight:750;font-variant-numeric:tabular-nums}
.last{margin:0 4px 12px;color:var(--soft);font-size:.8125rem}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn-main{height:52px;border:0;border-radius:15px;background:var(--lime);color:var(--lime-ink);font-size:1rem;font-weight:780;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-main svg{width:20px;height:20px}
.btn-del{height:52px;padding:0 18px;border:0;border-radius:15px;background:var(--red-soft);color:var(--red);font-weight:720;display:inline-flex;align-items:center;gap:6px}
.btn-del svg{width:18px;height:18px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

/* purchase history page */
.page{position:fixed;inset:0;z-index:10;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);animation:slidein .26s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(100%)}}
.back{height:36px;padding:0 8px 0 0;border:0;background:none;color:var(--lime);display:inline-flex;align-items:center;gap:2px;font-size:1rem;font-weight:650}
.back svg{width:24px;height:24px}
.page-body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.page-body h1{margin:2px 0 14px}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;margin-bottom:14px;border-radius:13px;background:var(--field)}
.search svg{width:18px;height:18px;color:var(--faint)}
.search input{flex:1;min-width:0;height:42px;border:0;background:none;font-size:1rem}
.search input:focus{outline:none}
.search input::placeholder{color:var(--faint)}
.sumcard{margin-bottom:16px;padding:13px 15px;border-radius:16px;background:var(--lime-soft)}
.sumcard b{display:block;color:var(--lime);font-size:1.0625rem;font-weight:780}
.sumcard p{margin:3px 0 0;color:#D6EE9C;font-size:.875rem}
#histList{display:grid;gap:18px}
.hrow{display:flex;align-items:center;gap:10px;min-height:60px;padding:0 10px 0 14px}
.hrow + .hrow{border-top:1px solid var(--sep)}
.hmain{flex:1;min-width:0;align-self:stretch;padding:9px 0;border:0;background:none;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.again{flex:none;height:32px;padding:0 12px;border:0;border-radius:16px;background:var(--lime-soft);color:var(--lime);font-size:.8125rem;font-weight:720}
.again.is-in{background:var(--field);color:var(--soft)}
.page .empty{padding-top:40px}

/* toast */
.toastbar{position:fixed;left:0;right:0;bottom:calc(var(--kb) + var(--composer-h) + 10px);z-index:30;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.on-page .toastbar,.on-sheet .toastbar{bottom:calc(var(--kb) + 16px + env(safe-area-inset-bottom,0px))}
#toast{pointer-events:auto;width:100%;max-width:528px;display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;background:#ECEEF1;color:#111214;font-size:.9375rem;font-weight:560;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:fade .18s}
.toast-act{margin-left:auto;padding:2px;border:0;background:none;color:#3F5C00;font-weight:800;white-space:nowrap}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="col top-in">
    <div class="heading">
      <h1>살 것</h1>
      <p class="tally" id="tally">&nbsp;</p>
    </div>
    <button id="histBtn" class="pill-btn" type="button" aria-label="구매 기록 보기"></button>
  </div>
</header>

<main class="col">
  <p id="notice" class="notice" hidden></p>
  <div id="tiles" class="tiles" hidden></div>
  <div id="stores" class="stores hscroll" role="group" aria-label="가게별 보기" hidden></div>
  <div id="lists" aria-label="살 것"></div>
</main>

<div id="composer" class="composer">
  <div class="col">
    <div id="sug" class="sug hscroll" aria-label="전에 산 것" hidden></div>
    <div id="when" class="hscroll" role="group" aria-label="언제 살지" hidden></div>
    <form id="addForm" class="add-row" autocomplete="off">
      <label for="addInput" class="sr">살 것 추가</label>
      <input id="addInput" type="text" enterkeyhint="done" maxlength="600" autocomplete="off">
      <button id="addBtn" class="add" type="submit" aria-label="추가"></button>
    </form>
  </div>
</div>

<section id="histPage" class="page" aria-labelledby="histTitle" hidden>
  <header class="top">
    <div class="col top-in">
      <button id="histBack" class="back" type="button"></button>
    </div>
  </header>
  <div class="col page-body">
    <h1 id="histTitle">구매 기록</h1>
    <label class="search"><span id="searchIcon"></span><span class="sr">구매 기록에서 찾기</span>
      <input id="histQ" type="search" placeholder="이름이나 가게로 찾기" enterkeyhint="search" autocomplete="off">
    </label>
    <div id="histSum"></div>
    <div id="histList"></div>
  </div>
</section>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div id="scrim" class="scrim"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="고치기"></section>
</div>
<datalist id="storeList"></datalist>

<div class="toastbar"><div id="toast" role="status" aria-live="polite" hidden></div></div>

<script>
(function(){
  "use strict";

  const STORE_KEY = "shopping-list-v2";
  const OLD_KEY = "shopping-list-v1";   // 첫 버전 저장본. 처음 열 때 한 번 옮겨 오고 지우지는 않는다.
  const HIST_MAX = 1500;

  // 링크 주소 → 가게 이름. 위에서부터 맞춰 보므로 더 구체적인 주소를 앞에 둔다. 끝이 "."이면 그 글자가 들어 있기만 하면 된다.
  const SHOPS = [
    ["coupang.com","쿠팡"],["coupa.ng","쿠팡"],
    ["smartstore.naver.com","네이버"],["brand.naver.com","네이버"],["shopping.naver.com","네이버"],["naver.me","네이버"],["naver.com","네이버"],
    ["emart.ssg.com","이마트몰"],["ssg.com","SSG"],["musinsa.com","무신사"],["11st.co.kr","11번가"],["gmarket.co.kr","G마켓"],["auction.co.kr","옥션"],
    ["oliveyoung.co.kr","올리브영"],["daisomall.co.kr","다이소"],["daiso.co.kr","다이소"],["kurly.com","컬리"],["29cm.co.kr","29CM"],
    ["zigzag.kr","지그재그"],["a-bly.com","에이블리"],["aliexpress.","알리"],["temu.com","테무"],["lotteon.com","롯데ON"],["homeplus.co.kr","홈플러스"],
    ["gift.kakao.com","카카오 선물하기"],["ohou.se","오늘의집"],["idus.com","아이디어스"],["yes24.com","YES24"],["kyobobook.co.kr","교보문고"],
    ["aladin.co.kr","알라딘"],["danawa.com","다나와"],["interpark.com","인터파크"],["apple.com","애플"],["samsung.com","삼성닷컴"],
    ["ikea.com","이케아"],["costco.co.kr","코스트코"],["uniqlo.com","유니클로"],["hmall.com","현대H몰"],["amazon.","아마존"]
  ];
  // "계란 30구"처럼 숫자 뒤에 붙으면 수량으로 보는 말. 2L·500g 같은 용량은 이름에 그대로 둔다.
  const COUNT_UNITS = "개 구 팩 병 캔 봉 봉지 박스 통 롤 장 켤레 모 단 묶음 줄 판 망 송이 마리 포 세트 권 자루 알 정 매 개입".split(" ");
  const URL_RE = /https?:\/\/[^\s<>"']+/i;
  const WD = "일월화수목금토";

  const $ = id => document.getElementById(id);
  const tally = $("tally"), notice = $("notice"), tilesEl = $("tiles"), storesEl = $("stores"), lists = $("lists");
  const composer = $("composer"), sugEl = $("sug"), whenEl = $("when"), addForm = $("addForm"), addInput = $("addInput");
  const histPage = $("histPage"), histQ = $("histQ"), histSum = $("histSum"), histList = $("histList");
  const sheetWrap = $("sheetWrap"), sheet = $("sheet"), storeList = $("storeList"), toastEl = $("toast");
  const root = document.documentElement;
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- 아이콘 (Lucide, ISC 라이선스) ----
  const svg = (p, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const I = {
    check: svg('<path d="M20 6 9 17l-5-5"/>', 3.2),
    trash: svg('<path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
    ext: svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
    history: svg('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>'),
    plus: svg('<path d="M5 12h14"/><path d="M12 5v14"/>', 2.6),
    minus: svg('<path d="M5 12h14"/>', 2.6),
    x: svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 2.4),
    search: svg('<path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>'),
    cal: svg('<path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>'),
    link: svg('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'),
    left: svg('<path d="m15 18-6-6 6-6"/>', 2.4),
    bag: svg('<path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/>'),
    tag: svg('<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>')
  };

  function el(tag, attrs, ...kids){
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)){
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids){ if (c != null && c !== false) e.append(c); }
    return e;
  }
  const icon = html => el("span", { html, "aria-hidden": "true", style: "display:contents" });

  // ---- 날짜·글자 ----
  const pad = n => String(n).padStart(2, "0");
  const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const md = d => `${d.getMonth() + 1}월 ${d.getDate()}일`;
  const mdk = k => md(fromKey(k));
  const won = n => Number(n).toLocaleString("ko-KR") + "원";
  const norm = s => String(s || "").replace(/\s+/g, "").toLowerCase();
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const qtyText = it => it.unit ? `${it.qty}${it.unit}` : (it.qty > 1 ? `×${it.qty}` : "");
  const today = () => dayKey(new Date());
  const tomorrow = () => dayKey(addDays(new Date(), 1));
  function dateWord(k){
    if (!k) return "언제든";
    if (k === today()) return "오늘";
    if (k === tomorrow()) return "내일";
    return mdk(k);
  }

  // "우유 2" "계란 30구" "휴지 ×3" → 이름·수량. 숫자 앞에 띄어쓰기가 있어야 수량으로 본다(비타500은 이름 그대로).
  function parseEntry(raw){
    const s = String(raw || "").trim().replace(/\s+/g, " ");
    if (!s) return null;
    let m = s.match(/^(.+?)(?:\s+[xX]|\s*[×*])\s*(\d{1,4})$/);
    if (m) return { name: m[1].slice(0, 60), qty: clampQty(+m[2]), unit: "" };
    m = s.match(/^(.+?)\s+(\d{1,4})\s?([^\s\d]{0,3})$/u);
    if (m && (!m[3] || COUNT_UNITS.includes(m[3]))){
      return { name: m[1].slice(0, 60), qty: clampQty(+m[2]), unit: m[3] === "개" ? "" : (m[3] || "") };
    }
    return { name: s.slice(0, 60), qty: null, unit: "" };
  }
  const clampQty = n => Math.max(1, Math.min(9999, Math.round(n) || 1));
  function qtyFromOld(q){
    const m = String(q || "").match(/^(\d+(?:\.\d+)?)(.*)$/);
    if (!m) return { qty: 1, unit: "" };
    const unit = m[2].trim();
    return { qty: clampQty(+m[1]), unit: unit === "개" ? "" : unit };
  }

  // 주소처럼 생긴 글 → 열 수 있는 https 주소. 글 안에 주소가 섞여 있으면 그 주소만 꺼낸다. javascript: 같은 건 버린다.
  function safeLink(raw){
    let s = String(raw || "").trim();
    if (!s) return "";
    const m = s.match(URL_RE);
    if (m) s = m[0];
    else if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s)) s = "https://" + s;
    else return "";
    s = s.replace(/[)\].,!?'"]+$/, "");
    try { const u = new URL(s); return /^https?:$/.test(u.protocol) ? u.href : ""; } catch (e) { return ""; }
  }
  function storeFromUrl(link){
    let host;
    try { host = new URL(link).hostname.toLowerCase(); } catch (e) { return ""; }
    host = host.replace(/^(www|m|mw|mobile)\./, "");
    for (const [d, name] of SHOPS){
      if (d.endsWith(".") ? host.includes(d) : (host === d || host.endsWith("." + d))) return name;
    }
    const p = host.split(".");
    if (p.length < 2) return "";
    let i = p.length - 2;
    if (i > 0 && ["co", "or", "ne", "go", "ac", "com"].includes(p[i])) i--;
    return p[i];
  }
  // 쇼핑 앱 '공유'로 복사한 글(상품명 + 주소, 가끔 가격)을 이름·링크·가게·가격으로 나눈다.
  function fromShared(text){
    const m = text.match(URL_RE);
    const link = safeLink(m ? m[0] : "");
    let price = 0;
    const keep = [];
    for (let line of text.replace(m ? m[0] : "", "\n").split(/\n+/)){
      line = line.replace(/\[[^\]]{0,20}\]/g, " ");
      // 가격은 줄 어디에 있든 꺼내고 이름에서는 뺀다.
      line = line.replace(/(?:판매가|할인가|최종가|가격)?\s*:?\s*(\d{1,3}(?:,\d{3})+|\d{3,})\s*원/, (all, p) => { price = price || +p.replace(/,/g, ""); return " "; });
      line = line.replace(/\s+/g, " ").trim();
      if (!line) continue;
      if (line.length < 30 && /추천합니다|공유|친구에게|앱에서 보기|지금 확인/.test(line)) continue;
      keep.push(line);
    }
    const name = keep.join(" ").replace(/^[\s\-:·|]+|[\s\-:·|]+$/g, "").slice(0, 60).trim();
    return { name, qty: null, unit: "", link, store: storeFromUrl(link), price };
  }

  // ---- 저장 (이 휴대폰의 브라우저에만) ----
  function load(){
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (d && Array.isArray(d.items) && Array.isArray(d.history)) return d;
    } catch (e) {}
    const d = { v: 2, items: [], history: [] };
    try {
      const old = JSON.parse(localStorage.getItem(OLD_KEY) || "null");
      if (old && typeof old === "object"){
        for (const [id, o] of Object.entries(old)){
          if (!o || !o.name) continue;
          const q = qtyFromOld(o.qty);
          if (o.need) d.items.push({ id, name: o.name, qty: q.qty, unit: q.unit, date: "", store: "", link: "", price: 0, addedAt: o.addedAt || Date.now() });
          if (o.count > 0 && o.lastBought) d.history.push({ id: "h" + id, name: o.name, qty: q.qty, unit: q.unit, store: "", link: "", price: 0, at: o.lastBought });
        }
        d.items.sort((a, b) => a.addedAt - b.addedAt);
        d.history.sort((a, b) => b.at - a.at);
      }
    } catch (e) {}
    return d;
  }
  const data = load();
  function save(){
    if (data.history.length > HIST_MAX) data.history.length = HIST_MAX;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
    catch (e) { notice.textContent = "이 브라우저에서는 저장이 안 돼서, 창을 닫으면 목록이 사라져요."; notice.hidden = false; }
  }
  save();

  const ui = { store: "", addDate: "", composing: false, flashId: "" };
  const findItem = id => data.items.find(i => i.id === id);
  const lastOf = n => data.history.find(h => norm(h.name) === n);   // history는 최근 것이 앞
  // 같은 물건을 산 기록 중 가게나 링크를 적어 둔 가장 최근 한 건. 가게와 링크가 서로 다른 구매에서 섞이지 않게 한 건에서만 가져온다.
  function memoryOf(n){
    const h = data.history.find(x => norm(x.name) === n && (x.store || x.link));
    return { store: h ? h.store : "", link: h ? h.link : "" };
  }

  // ---- 동작 ----
  function addItem(e, opts){
    const n = norm(e.name);
    if (n){
      const ex = data.items.find(i => norm(i.name) === n);
      if (ex){
        if (e.qty){ ex.qty = e.qty; ex.unit = e.unit || ex.unit; save(); ui.flashId = ex.id; render(); toast(`‘${ex.name}’ 수량을 ${qtyText(ex) || "1"}로 바꿨어요`); }
        else {
          ui.flashId = ex.id; render();
          toast(`‘${ex.name}’은 이미 있어요`, "수량 +1", () => { ex.qty = clampQty(ex.qty + 1); save(); ui.flashId = ex.id; render(); });
        }
        return ex;
      }
    }
    // 전에 산 적이 있으면 그때 가게·링크를 그대로 채운다.
    const mem = n ? memoryOf(n) : { store: "", link: "" };
    const it = {
      id: newId(), name: e.name, qty: e.qty || 1, unit: e.unit || "",
      date: opts && "date" in opts ? opts.date : ui.addDate,
      store: e.store || (e.link ? storeFromUrl(e.link) : "") || mem.store,
      link: e.link || mem.link, price: e.price || 0, addedAt: Date.now()
    };
    data.items.push(it);
    save();
    ui.flashId = it.id;
    render();
    return it;
  }
  function addText(text){
    const t = text.trim();
    if (!t) return;
    // 주소가 든 글(쇼핑 앱에서 공유로 복사한 것)은 쉼표가 있어도 한 개로 본다.
    if (URL_RE.test(t)){
      const it = addItem(fromShared(t));
      if (!it.name){ addInput.blur(); openItemSheet(it.id, true); }
      return;
    }
    t.split(/[,，\n]/).map(s => s.trim()).filter(Boolean).forEach(p => { const e = parseEntry(p); if (e) addItem(e); });
  }
  function buy(id){
    const i = data.items.findIndex(x => x.id === id);
    if (i < 0) return;
    const it = data.items[i];
    const h = { id: newId(), name: it.name || "이름 없음", qty: it.qty, unit: it.unit, store: it.store, link: it.link, price: it.price || 0, at: Date.now() };
    data.items.splice(i, 1);
    data.history.unshift(h);
    save(); render();
    toast(`‘${h.name}’ 샀어요`, "되돌리기", () => {
      data.history = data.history.filter(x => x.id !== h.id);
      data.items.splice(Math.min(i, data.items.length), 0, it);
      save(); render();
    });
  }
  function removeItem(id){
    const i = data.items.findIndex(x => x.id === id);
    if (i < 0) return;
    const it = data.items.splice(i, 1)[0];
    save(); render();
    toast(`‘${it.name || "이름 없음"}’ 지웠어요`, "되돌리기", () => { data.items.splice(Math.min(i, data.items.length), 0, it); save(); render(); });
  }
  function reAdd(h){
    const inList = data.items.find(i => norm(i.name) === norm(h.name));
    if (inList){ toast(`‘${h.name}’은 이미 목록에 있어요`); return; }
    addItem({ name: h.name, qty: h.qty, unit: h.unit, store: h.store, link: h.link }, { date: "" });
    renderHistory();
    toast(`‘${h.name}’ 다시 담았어요`);
  }

  // ---- 토스트 ----
  let toastTimer = 0;
  const hideToast = () => { toastEl.hidden = true; };
  function toast(msg, label, action){
    toastEl.replaceChildren(el("span", { text: msg }),
      label ? el("button", { class: "toast-act", type: "button", onclick: () => { hideToast(); action(); } }, label) : null);
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, label ? 5000 : 2400);
  }

  // ---- 목록 화면 ----
  const inStore = it => !ui.store || (ui.store === "\u0000" ? !it.store : it.store === ui.store);

  function render(){
    const t = today();
    const all = data.items;
    const items = all.filter(inStore);
    const byAdded = (a, b) => a.addedAt - b.addedAt;
    const over = items.filter(i => i.date && i.date < t).sort((a, b) => a.date.localeCompare(b.date) || byAdded(a, b));
    const now = items.filter(i => i.date === t).sort(byAdded);
    const any = items.filter(i => !i.date).sort(byAdded);
    const later = items.filter(i => i.date > t).sort((a, b) => a.date.localeCompare(b.date) || byAdded(a, b));

    tally.textContent = all.length ? `${all.length}개 남음` : data.history.length ? "다 샀어요" : " ";

    // 개수 타일
    tilesEl.hidden = !all.length;
    const tile = (label, n, cls, target) => el("button", {
      class: "tile" + (n ? "" : " is-zero") + (n && cls ? " " + cls : ""), type: "button",
      "aria-label": `${label} ${n}개`, onclick: () => { const s = $(target); if (n && s) s.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); }
    }, el("span", { class: "tl", text: label }), el("span", { class: "tn", text: String(n) }));
    tilesEl.replaceChildren(
      tile("지난 것", over.length, "is-over", "sec-over"),
      tile("오늘", now.length, "is-today", "sec-today"),
      tile("언제든", any.length, "", "sec-any"),
      tile("예정", later.length, "", "sec-later"));

    // 가게 칩: 가게를 적은 게 하나라도 있을 때만
    const counts = new Map(); let noStore = 0;
    all.forEach(i => { if (i.store) counts.set(i.store, (counts.get(i.store) || 0) + 1); else noStore++; });
    if (ui.store && ui.store !== "\u0000" && !counts.has(ui.store)) ui.store = "";
    if (ui.store === "\u0000" && !noStore) ui.store = "";
    storesEl.hidden = !counts.size;
    const schip = (label, n, value) => el("button", { class: "c", type: "button", "aria-pressed": String(ui.store === value),
      onclick: () => { ui.store = ui.store === value ? "" : value; render(); } }, label, el("span", { class: "n", text: String(n) }));
    storesEl.replaceChildren(schip("전체", all.length, ""),
      ...[...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko")).map(([s, n]) => schip(s, n, s)),
      noStore && counts.size ? schip("가게 미정", noStore, "\u0000") : null);

    const parts = [];
    if (!all.length) parts.push(emptyState());
    const section = (id, cls, title, sub, rows, showDate) => {
      if (!rows.length) return;
      parts.push(el("section", { class: "sec " + cls, id },
        el("h2", { class: "sec-h" }, title, sub ? el("span", { class: "sub", text: sub }) : null, el("span", { class: "n", text: String(rows.length) })),
        el("ul", { class: "card" }, ...rows.map(it => row(it, showDate)))));
    };
    const wd = k => WD[fromKey(k).getDay()] + "요일";
    section("sec-over", "sec-over", "지난 것", "날짜가 지났어요", over, true);
    section("sec-today", "sec-today", "오늘", `${mdk(t)} ${wd(t)}`, now, false);
    section("sec-any", "sec-any", "언제든", "", any, false);
    let first = true;
    for (const k of [...new Set(later.map(i => i.date))]){
      const label = k === tomorrow() ? "내일" : mdk(k);
      section(first ? "sec-later" : "", "", label, k === tomorrow() ? `${mdk(k)} ${wd(k)}` : wd(k), later.filter(i => i.date === k), false);
      first = false;
    }
    lists.replaceChildren(...parts);

    if (ui.flashId){
      const li = lists.querySelector(`[data-id="${ui.flashId}"]`);
      ui.flashId = "";
      if (li){ li.classList.add("is-new"); li.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); }
    }
    renderComposer();
  }

  function emptyState(){
    const tip = (ic, text) => el("li", null, icon(ic), el("span", { text }));
    return el("div", { class: "empty" },
      el("div", { class: "badge", html: I.bag }),
      el("h2", { text: data.history.length ? "다 샀어요" : "살 것을 적어 보세요" }),
      el("p", { text: data.history.length ? "산 것은 오른쪽 위 ‘기록’에 언제·어디서 샀는지 남아 있어요." : "아래 칸에 적으면 날짜별로 정리돼요." }),
      data.history.length ? null : el("ul", { class: "tips" },
        tip(I.plus, "‘우유 2, 건전지’처럼 쉼표로 여러 개를 한 번에"),
        tip(I.link, "쇼핑몰 링크를 붙여 넣으면 가게까지 알아서"),
        tip(I.check, "오른쪽으로 밀면 샀음, 왼쪽으로 밀면 삭제")));
  }

  function row(it, showDate){
    const q = qtyText(it);
    const meta = [];
    if (showDate && it.date) meta.push(el("span", { class: "warn", text: mdk(it.date) }));
    if (it.store) meta.push(el("span", { text: it.store }));
    if (it.price) meta.push(el("span", { text: won(it.price) }));
    const label = (it.name || "이름 없음") + (q ? " " + q : "");
    const fg = el("div", { class: "row-fg" },
      el("button", { class: "tick", type: "button", "aria-label": label + " 샀어요", onclick: () => tickBuy(li, it.id) },
        el("i", { html: I.check })),
      el("button", { class: "rbody", type: "button", "aria-label": label + " 고치기", onclick: () => openItemSheet(it.id) },
        el("span", { class: "nline" }, el("span", { class: "name" + (it.name ? "" : " is-blank"), text: it.name || "이름 없음" }), q ? el("span", { class: "qty", text: q }) : null),
        meta.length ? el("span", { class: "meta" }, ...meta) : null),

  function collapse(li, then){
    if (reduceMotion || !li.isConnected){ then(); return; }

  function tickBuy(li, id){

  // 오른쪽으로 밀면 샀음, 왼쪽으로 밀면 삭제. 세로로 먼저 움직이면 스크롤로 넘긴다.
  function attachSwipe(li, fg, id){
    let x0 = 0, y0 = 0, dx = 0, pid = null, tracking = false, sliding = false;
    const limit = () => Math.min(120, li.offsetWidth * 0.32);
    fg.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (li.dataset.busy) return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; pid = e.pointerId; tracking = true; sliding = false;
    });
    fg.addEventListener("pointermove", e => {
      if (!tracking || e.pointerId !== pid) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!sliding){
        if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
        if (Math.abs(my) >= Math.abs(mx)){ tracking = false; return; }
        sliding = true;
        try { fg.setPointerCapture(pid); } catch (err) {}
        fg.style.transition = "none";
      }
      dx = mx;
      fg.style.transform = `translateX(${dx}px)`;
      li.dataset.dir = dx > 0 ? "buy" : "del";
      li.classList.toggle("is-armed", Math.abs(dx) > limit());
    });
    const end = e => {
      if (!tracking || e.pointerId !== pid) return;
      tracking = false;
      if (!sliding) return;
      fg._swiped = true;
      setTimeout(() => { fg._swiped = false; }, 400);
      const go = e.type !== "pointercancel" && Math.abs(dx) > limit();
      if (go){
        li.dataset.busy = "1";
        const dir = dx > 0 ? 1 : -1;
        fg.style.transition = reduceMotion ? "none" : "transform .18s ease-in";
        fg.style.transform = `translateX(${dir * 110}%)`;
        setTimeout(() => collapse(li, () => (dir > 0 ? buy(id) : removeItem(id))), reduceMotion ? 0 : 170);
      } else {
        fg.style.transition = "transform .2s ease";
        fg.style.transform = "";
        setTimeout(() => { delete li.dataset.dir; li.classList.remove("is-armed"); }, 200);
      }
    };
    fg.addEventListener("pointerup", end);
    fg.addEventListener("pointercancel", end);
    // 밀고 손을 뗄 때 따라오는 '누름'은 무시한다.
    fg.addEventListener("click", e => { if (fg._swiped){ e.preventDefault(); e.stopPropagation(); fg._swiped = false; } }, true);
  }

  function suggestions(q){
    if (URL_RE.test(q)) return [];
    const have = new Set(data.items.map(i => norm(i.name)));
    const seen = new Map();
    for (const h of data.history){
      const k = norm(h.name);
      if (!k || have.has(k)) continue;
      const s = seen.get(k);
      if (s) s.count++; else seen.set(k, { h, count: 1 });
    }
    let list = [...seen.entries()];
    const nq = norm(q);
    if (nq){
      list = list.filter(([k]) => k.includes(nq) && k !== nq)
        .sort((a, b) => (b[0].startsWith(nq) - a[0].startsWith(nq)) || b[1].count - a[1].count);
    } else {
      list.sort((a, b) => b[1].count - a[1].count || b[1].h.at - a[1].h.at);
    }
    return list.slice(0, 8).map(([k, s]) => Object.assign({}, s.h, memoryOf(k)));
  }

  });
  addInput.addEventListener("focus", () => { ui.composing = true; renderComposer(); });
  // 날짜 고르는 창이 떠 있는 동안(초점이 입력칸 영역 안)에는 칩 줄을 접지 않는다.
  composer.addEventListener("focusout", () => setTimeout(() => {
    if (composer.contains(document.activeElement)) return;
    ui.composing = false;
    renderComposer();
  }, 150));

  // 입력칸 높이만큼 목록 아래를 비우고, 키보드가 올라오면 입력칸을 키보드 위로 올린다.
  if ("ResizeObserver" in window){
    new ResizeObserver(() => root.style.setProperty("--composer-h", composer.offsetHeight + "px")).observe(composer);
  }
  const vv = window.visualViewport;
  if (vv){
    const fit = () => {
      const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      root.style.setProperty("--kb", kb + "px");
      root.classList.toggle("kb-open", kb > 60);
    };
    vv.addEventListener("resize", fit);
    vv.addEventListener("scroll", fit);
    fit();
  }
  // 자정을 넘겨 다시 열면 '오늘'·'지난 것'을 다시 나눈다.
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ render(); renderHistory(); } });

  render();

  // 인터넷이 약한 곳(마트 안)에서도 바로 열리게 한다. https(또는 개발용 localhost)에서만 동작.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
